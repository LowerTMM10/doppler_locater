[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "http://doppler.lowertmm10.uk/*"
  to = "https://doppler.lowertmm10.uk/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/adsb/*"
  to = "https://api.adsb.lol/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/doppler_detector/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
